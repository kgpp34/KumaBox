version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - depguard
    - dogsled
    - errcheck
    - forbidigo
    - gochecknoinits
    - gocritic
    - gosec
    - govet
    - ineffassign
    - modernize
    - revive
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        no-command-dependencies:
          files:
            - "$all"
            - "!$test"
            - "!**/cli/**"
            - "!**/cmd/**"
            - "!**/main.go"
          deny:
            - pkg: github.com/kumabox/kumabox/cmd
              desc: library packages must not import process entry points
            - pkg: github.com/kumabox/kumabox/cli
              desc: library packages must not import CLI adapters
        composition-does-not-belong-to-modules:
          files:
            - "$all"
            - "!$test"
            - "!**/core/**"
            - "!**/cli/**"
            - "!**/main.go"
          deny:
            - pkg: github.com/kumabox/kumabox/core
              desc: modules must not depend on application composition
        shared-types-have-no-module-dependencies:
          files:
            - "**/types/**"
            - "!$test"
          deny:
            - pkg: github.com/kumabox/kumabox/core
              desc: shared data contracts must not depend on application services
            - pkg: github.com/kumabox/kumabox/cli
              desc: shared data contracts must not depend on command presentation
            - pkg: github.com/kumabox/kumabox/images
              desc: shared data contracts must not depend on image implementations
            - pkg: github.com/kumabox/kumabox/sandbox
              desc: shared data contracts must not depend on sandbox adapters
            - pkg: github.com/kumabox/kumabox/disk
              desc: shared data contracts must not depend on disk adapters
            - pkg: github.com/kumabox/kumabox/metadata
              desc: shared data contracts must not depend on persistence engines
        catalog-is-an-edge-adapter:
          files:
            - "$all"
            - "!$test"
            - "!**/core/**"
            - "!**/images/catalog/**"
          deny:
            - pkg: github.com/kumabox/kumabox/images/catalog
              desc: only core may assemble the image catalog adapter
        image-domain-is-engine-neutral:
          files:
            - "**/images/*.go"
            - "!$test"
          deny:
            - pkg: github.com/kumabox/kumabox/metadata
              desc: image domain contracts must not depend on persistence engines
        testing-is-test-only:
          files:
            - "$all"
            - "!$test"
          deny:
            - pkg: testing
              desc: test helpers belong in test files, not production packages
        sqlite-is-an-edge-adapter:
          files:
            - "$all"
            - "!$test"
            - "!**/core/**"
            - "!**/metadata/sqlite/**"
          deny:
            - pkg: github.com/kumabox/kumabox/metadata/sqlite
              desc: only core may assemble the SQLite adapter
        source-is-an-edge-adapter:
          files:
            - "$all"
            - "!$test"
            - "!**/core/**"
            - "!**/images/source/**"
          deny:
            - pkg: github.com/kumabox/kumabox/images/source
              desc: only core may assemble container image sources
        erofs-is-an-edge-adapter:
          files:
            - "$all"
            - "!$test"
            - "!**/core/**"
            - "!**/images/erofs/**"
          deny:
            - pkg: github.com/kumabox/kumabox/images/erofs
              desc: only core may assemble the EROFS converter
        sql-only-in-sqlite:
          files:
            - "$all"
            - "!$test"
            - "!**/metadata/sqlite/**"
          deny:
            - pkg: database/sql
              desc: SQL belongs to the metadata engine adapter
            - pkg: modernc.org/sqlite
              desc: the SQLite driver belongs to the metadata engine adapter
        metadata-does-not-own-images:
          files:
            - "**/metadata/**"
            - "!$test"
          deny:
            - pkg: github.com/kumabox/kumabox/images
              desc: image business facts belong to images, not metadata
        mechanisms-do-not-own-business:
          files:
            - "**/storage/**"
            - "**/lock/**"
            - "**/errdefs/**"
            - "!$test"
          deny:
            - pkg: github.com/kumabox/kumabox/images
              desc: mechanisms must not depend on image business logic
            - pkg: github.com/kumabox/kumabox/metadata
              desc: mechanisms must not depend on metadata engines
    forbidigo:
      forbid:
        - pattern: ^panic$
          msg: return a classified error instead of panicking
        - pattern: ^os\.Getenv$
          msg: environment access must stay at an approved configuration boundary
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: strict
    paths:
      - vendor
      - dist
    rules:
      - path: _test\.go
        linters:
          - forbidigo
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/kumabox/kumabox
