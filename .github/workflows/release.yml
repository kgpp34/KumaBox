name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Check tag and release notes
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          test -s ".github/release-notes/$GITHUB_REF_NAME.md"
      - name: Test native init
        run: |
          rustup toolchain install 1.89.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.89.0
          make boot-test
      - name: Verify Go and shell sources
        run: make verify VERSION="$GITHUB_REF_NAME"
      - name: Lint
        run: make lint
      - name: Check module files and local documentation
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          test -z "$(git ls-files docs)"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test SDKs
        run: |
          PYTHONPATH=sdk/python python -m unittest discover -s sdk/python/tests -v
          npm ci --prefix sdk/typescript
          npm --prefix sdk/typescript test
      - name: Test published E2B SDK compatibility
        run: |
          npm install --prefix /tmp/kumabox-e2b-node --no-audit --no-fund e2b@2.52.0
          python -m pip install --target /tmp/kumabox-e2b-python e2b==2.52.0
          KUMABOX_E2B_NODE_MODULE=/tmp/kumabox-e2b-node/node_modules/e2b \
            KUMABOX_E2B_PYTHON_PATH=/tmp/kumabox-e2b-python \
            go test ./internal/api/e2b -run TestPublishedE2B -v

  host-assets:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build Linux amd64 archive and checksum
        run: sh scripts/release-assets.sh "$GITHUB_REF_NAME"
      - name: Verify archive contents and embedded version
        run: |
          cd dist/release
          sha256sum -c SHA256SUMS
          test "$(tar -tzf "kumabox_${GITHUB_REF_NAME}_linux_amd64.tar.gz" | sort)" = "$(printf 'kumabox\nkumabox-check')"
          tar -xzf "kumabox_${GITHUB_REF_NAME}_linux_amd64.tar.gz"
          ./kumabox version --json | jq -e --arg version "$GITHUB_REF_NAME" --arg commit "$GITHUB_SHA" \
            '.version == $version and .commit == $commit'
      - uses: actions/upload-artifact@v4
        with:
          name: release-host-assets
          path: |
            dist/release/kumabox_*.tar.gz
            dist/release/SHA256SUMS
          if-no-files-found: error

  guest-image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Resolve immutable Ubuntu base image
        id: ubuntu
        run: |
          digest=$(docker buildx imagetools inspect docker.io/library/ubuntu:24.04 \
            --format '{{json .Manifest}}' | jq -er '.digest | select(test("^sha256:[a-f0-9]{64}$"))')
          echo "ref=docker.io/library/ubuntu@$digest" >> "$GITHUB_OUTPUT"
      - name: Record guest build time
        id: build-time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push versioned boot artifacts
        id: boot
        uses: docker/build-push-action@v7
        with:
          context: .
          file: oci-images/boot/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ghcr.io/kgpp34/kumabox/boot:6.18.37-${{ github.ref_name }}
      - name: Build and push matching Ubuntu base
        id: base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: oci-images/base/24.04/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            BOOT_IMAGE=ghcr.io/kgpp34/kumabox/boot@${{ steps.boot.outputs.digest }}
            UBUNTU_IMAGE=${{ steps.ubuntu.outputs.ref }}
            KUMABOX_VERSION=${{ github.ref_name }}
            KUMABOX_COMMIT=${{ github.sha }}
            KUMABOX_BUILD_TIME=${{ steps.build-time.outputs.value }}
          tags: ghcr.io/kgpp34/kumabox/base:24.04-${{ github.ref_name }}
      - name: Publish single-layer runtime and Ubuntu compatibility tag
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: oci-images/rt/24.04/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            BASE_IMAGE=ghcr.io/kgpp34/kumabox/base@${{ steps.base.outputs.digest }}
            KUMABOX_VERSION=${{ github.ref_name }}
            KUMABOX_COMMIT=${{ github.sha }}
            KUMABOX_BUILD_TIME=${{ steps.build-time.outputs.value }}
          tags: |
            ghcr.io/kgpp34/kumabox/rt:24.04-${{ github.ref_name }}
            ghcr.io/kgpp34/kumabox/ubuntu:24.04-${{ github.ref_name }}

  draft-release:
    needs: [host-assets, guest-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-host-assets
          path: dist/release
      - name: Create draft with verified assets and image digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUEST_DIGEST: ${{ needs.guest-image.outputs.digest }}
        run: |
          test -n "$GUEST_DIGEST"
          cp ".github/release-notes/$GITHUB_REF_NAME.md" "$RUNNER_TEMP/release-notes.md"
          printf '\nGuest image: `ghcr.io/kgpp34/kumabox/ubuntu:24.04-%s` (`ghcr.io/kgpp34/kumabox/ubuntu@%s`).\n' \
            "$GITHUB_REF_NAME" "$GUEST_DIGEST" >> "$RUNNER_TEMP/release-notes.md"
          flags=(--draft)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" --json isDraft > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then
            # Acceptance may require rebuilding an unpublished candidate. Never
            # replace assets belonging to a release that is already public.
            jq -e '.isDraft == true' "$RUNNER_TEMP/existing-release.json"
            gh release upload "$GITHUB_REF_NAME" \
              "dist/release/kumabox_${GITHUB_REF_NAME}_linux_amd64.tar.gz" \
              dist/release/SHA256SUMS --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "KumaBox $GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$GITHUB_REF_NAME" \
              "dist/release/kumabox_${GITHUB_REF_NAME}_linux_amd64.tar.gz" \
              dist/release/SHA256SUMS \
              --verify-tag --title "KumaBox $GITHUB_REF_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
          fi
