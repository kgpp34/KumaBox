name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # verify covers T1/T2 only: pure models, coordinator ordering with fake ports,
  # and real SQLite/filesystem integration. It needs no root and no KVM, so it
  # runs on a plain runner. T3/T4 (real Cloud Hypervisor on Linux/KVM) are
  # executed manually on Linux hosts with KVM and the required VMM tooling.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify
        run: make verify

      - name: Race detector
        run: make race

      - name: Lint
        run: make lint

      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Reject tracked local documentation
        run: test -z "$(git ls-files docs)"

  sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test KumaBox Python SDK
        run: PYTHONPATH=sdk/python python -m unittest discover -s sdk/python/tests -v

      - name: Test KumaBox TypeScript SDK
        run: |
          npm ci --prefix sdk/typescript
          npm --prefix sdk/typescript test

      - name: Test published E2B SDK compatibility
        run: |
          npm install --prefix /tmp/kumabox-e2b-node --no-audit --no-fund e2b@2.52.0
          python -m pip install --target /tmp/kumabox-e2b-python e2b==2.52.0
          KUMABOX_E2B_NODE_MODULE=/tmp/kumabox-e2b-node/node_modules/e2b \
            KUMABOX_E2B_PYTHON_PATH=/tmp/kumabox-e2b-python \
            go test ./api/e2b -run TestPublishedE2B -v
