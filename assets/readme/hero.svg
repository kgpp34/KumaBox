<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="KumaBox: a disposable computer for every agent task">
<title>KumaBox: a disposable computer for every agent task</title>
<defs>
  <pattern id="iso" width="40" height="23.094" patternUnits="userSpaceOnUse">
    <path d="M0 0 L40 23.094 M40 0 L0 23.094" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
  </pattern>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#F5B83D" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#F5B83D" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vignette" cx="30%" cy="20%" r="90%">
    <stop offset="0%" stop-color="#22324A"/>
    <stop offset="100%" stop-color="#172233"/>
  </radialGradient>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#6F8FAF"/>
  </marker>
  <marker id="arrH" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#F5B83D"/>
  </marker>
</defs>
<style>
  text { font-family: 'Inter','Segoe UI','SF Pro Text',-apple-system,'Helvetica Neue',Arial,sans-serif; }
  .mono { font-family: 'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace; }
  .flow { stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -28; } }
  
  .clone { opacity: 0; animation: pop 6s ease-out infinite; }
  .c1 { animation-delay: 0.3s; } .c2 { animation-delay: 0.7s; } .c3 { animation-delay: 1.1s; } .c4 { animation-delay: 1.5s; }
  @keyframes pop { 0% {opacity:0; transform: translateX(-18px);} 12% {opacity:1; transform: translateX(0);} 86% {opacity:1;} 100% {opacity:0;} }
  .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 820px 205px; }
  @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .clone { opacity: 1; } }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
