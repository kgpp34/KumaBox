<text x="330" y="118" font-size="72" font-weight="800" letter-spacing="-1.5"><tspan fill="#E8EEF5">Kuma</tspan><tspan fill="#6F8FAF">Box</tspan></text>
<text x="330" y="178" font-size="30" fill="#E8EEF5" font-weight="600" text-anchor="start" >A disposable computer</text>
<text x="330" y="216" font-size="30" fill="#E8EEF5" font-weight="600" text-anchor="start" >for every agent task.</text>
<text x="330" y="262" font-size="18" fill="#98AABF" font-weight="400" text-anchor="start" >Hardware-isolated microVMs on KVM,</text>
<text x="330" y="288" font-size="18" fill="#98AABF" font-weight="400" text-anchor="start" >driven by one daemonless CLI.</text>
