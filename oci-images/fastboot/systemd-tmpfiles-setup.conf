[Unit]
Requires=kumabox-guest-prepare.service
After=kumabox-guest-prepare.service

[Service]
# Preserve the distribution's ordering after journal-flush. Repeating the full
# boot pass here could delete files or overwrite commands' output after the
# agent has started; only the excluded journal paths remain to be prepared.
ExecStart=
ExecStart=systemd-tmpfiles --create --remove --boot --prefix=/run/log/journal --prefix=/var/log/journal
